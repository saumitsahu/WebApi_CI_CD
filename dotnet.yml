name: ASP.NET Core CI

on:
  push:
    branches:
      - saumit_CI_CD

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore WebApplication2/WebApplication2.csproj

    - name: Build
      run: dotnet build WebApplication2/WebApplication2.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test WebApplication2/WebApplication2.csproj --configuration Release --no-build --verbosity normal

    - name: Publish
      run: dotnet publish WebApplication2/WebApplication2.csproj --configuration Release --output publish --no-build
